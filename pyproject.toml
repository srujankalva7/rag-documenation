[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-documentation"
version = "0.1.0"
description = "Cost-optimized RAG assistant for FastAPI documentation"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.27,<1",
  "tenacity>=9,<10",
  "tiktoken>=0.8,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
local = [
  "fastembed>=0.5,<1",
]
dev = [
  "httpx2>=2,<3",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
